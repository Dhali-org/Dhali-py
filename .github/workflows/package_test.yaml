name: Python package tests

on:
  pull_request:
    branches:
      - develop

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }} (xrpl-py ${{ matrix.xrpl-py-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
        xrpl-py-version: ['2.5.0', '3.0.0', '4.5.0']
      max-parallel: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies and test tools
        run: |
          python -m pip install --upgrade pip
          pip install ".[testing]"
          pip install "xrpl-py==${{ matrix.xrpl-py-version }}"

      - name: Run unit tests
        run: pytest --ignore=tests/test_integration.py

      - name: Run integration tests
        env:
          XRPL_TESTNET_SECRET: ${{ secrets.XRPL_TESTNET_SECRET }}
          SEPOLIA_TESTNET_SECRET: ${{ secrets.SEPOLIA_TESTNET_SECRET }}
          PYTHONPATH: ${{ github.workspace }}/src
        run: pytest tests/test_integration.py

      - name: Run mypy
        run: mypy src/dhali
